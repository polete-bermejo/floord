
name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.tag.outputs.exists }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Rename Linux binary
        run: cp target/release/floord floord-linux

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: floord-linux
          path: floord-linux

      - name: Get version
        if: github.event_name == 'push'
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "floord") | .version')

          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing tag
        if: github.event_name == 'push'
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin \
            "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: github.event_name == 'push' && steps.tag.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --verbose

      - name: Rename Windows binary
        shell: pwsh
        run: Copy-Item target/release/floord.exe floord-windows.exe

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: floord-windows
          path: floord-windows.exe

  release:
    name: Create Release
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-windows

    if: >
      github.event_name == 'push' &&
      needs.build-linux.outputs.tag_exists == 'false'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux.outputs.version }}
          generate_release_notes: true
          files: |
            dist/floord-linux
            dist/floord-windows.exe
