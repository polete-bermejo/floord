name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Get version
        if: github.event_name == 'push'
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "floord") | .version')

          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing tag
        if: github.event_name == 'push'
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin \
            "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: github.event_name == 'push' && steps.tag.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create Release
        if: github.event_name == 'push' && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: target/release/floord
